name: Build ChatterUI Fold APK

on:
  workflow_dispatch:
  push:
    branches:
      - fold-custom-v1

jobs:
  android-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean
        env:
          APP_VARIANT: development

      - name: Build installable APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ChatterUI-Fold-v0.9.0-fold1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChatterUI-Fold-APK
          path: ChatterUI-Fold-v0.9.0-fold1.apk
          if-no-files-found: error
          retention-days: 30
